<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID selector and class selector and group selector</title>
    <style>
        #first {
            color:darkgreen
        }
        .second {
            color:aquamarine
        } 
        h3,h4,h5 {
            color:hotpink
        }
        #Third,.fourth{
            color:blueviolet
        }
    </style>
</head>
<body>
    <h1 id="first">This is heading number 1</h1>
    <h2 class="second">This is the heading number 2</h2>
    <h3>This is heading 3</h3>
    <h4>This i sheading 4</h4>
    <h5>This is heading 5</h5>
    <p id="Third">This is the paragraph</p>
    <p class="fourth">This is the second paragraph</p>
</body>
</html>
