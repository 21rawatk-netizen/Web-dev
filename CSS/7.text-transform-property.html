<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text-decoration property</title>
</head>
<style>
    .box{height:100px; width:100px;}
    #p1{text-decoration: underline dashed;}
    #p2{text-decoration: underline dotted;}
    #p3{text-decoration: overline double;}
    #p4{text-decoration:line-through;}
    #p5{text-decoration:overline;}
    #p6{text-decoration:underline;}
    #p7{text-decoration: underline wavy;}
    #p8{text-decoration: overline solid;}
</style>
<body>
    <div id="p1">BOX1</div>
    <br>
    <div id="p2">BOX2</div>
    <br>
    <div id="p3">BOX3</div>
    <br>
    <div id="p4">BOX4</div>
    <br>
    <div id="p5">BOX5</div>
    <br>
    <div id="p6">BOX6</div>
    <br>
    <div id="p7">BOX7</div>
    <br>
    <div id="p8">BOX8</div>
    <a href="#">link</a>
    <a href="#" style="text-decoration: none;">link2</a>
</body>
</html>
