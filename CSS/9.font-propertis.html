<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font properties</title>
</head>
<style>
    #first{font-size: 10px;}
    #second{font-weight: 600;}
    #third{font-style: italic;}
    #fourth{font-family: Georgia, 'Times New Roman', Times, serif;}
    #fifth{font-display:fallback;}
    #sixth{font-variant:small-caps;}
</style>
<body>
    <div id="first">Lorem ipsum dolor sit amet.</div>
    <div id="second">Lorem ipsum dolor sit amet.</div>
    <div id="third">Lorem ipsum dolor sit amet.</div>
    <div id="fourth">Lorem ipsum dolor sit amet.</div>
    <div id="fifth">Lorem ipsum dolor sit amet.</div>
    <div id="sixth">Lorem ipsum dolor sit amet.</div>
</body>
</html>
