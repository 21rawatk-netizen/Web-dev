<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text align propert</title>
</head>
<style>
    *{
        margin:0px;
        padding:0px;
    }
    .box{
        height:100px;
        width:100px;
    }
    #box1{
        background-color: khaki; color:brown; text-align: center;
    }
    #box2{
        background-color: rgb(88, 247, 244); color:rgb(142, 27, 9); text-align: right;
    }
    #box3{
        background-color: rgb(197, 140, 240); color:rgb(127, 18, 18); text-align:left;
    }
</style>
<body>
    <div id="box1" class="box"> This is box1</div>
    <br>
    <div id="box2" class="box"> This is box2</div>
    <br>
    <div id="box3" class="box"> This is box3</div>
</body>
</html>
