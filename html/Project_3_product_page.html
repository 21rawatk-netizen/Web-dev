<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Page</title>
</head>
<body>

<header>
  <h1>Smart Watch X</h1>
</header>

<main>
  <figure>
    <img src="watch.jpg" alt="Smart Watch" width="300">
    <figcaption>Smart Watch X – Series 5</figcaption>
  </figure>

  <section>
    <h2>Product Details</h2>
    <table border="1">
      <tr><th>Feature</th><th>Details</th></tr>
      <tr><td>Battery</td><td>48 Hours</td></tr>
      <tr><td>Waterproof</td><td>Yes</td></tr>
    </table>
  </section>

  <section>
    <h2>Buy Now</h2>
    <form>
      <label>Name:</label>
      <input type="text" required><br><br>
      <label>Address:</label>
      <textarea required></textarea><br><br>
      <button type="submit">Place Order</button>
    </form>
  </section>
</main>

</body>
</html>
